      - name: Use preinstalled Android NDK
        run: |
          set -e
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"

      - name: Build native Android bridge
        run: |
          set -e
          mkdir -p project/src/main/resources/native/arm64-v8a
          mkdir -p project/src/main/resources/native/x86_64

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            -shared -fPIC -O2 \
            project/src/main/cpp/mobilehaptics.c \
            -o project/src/main/resources/native/arm64-v8a/libmobilehaptics.so

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang" \
            -shared -fPIC -O2 \
            project/src/main/cpp/mobilehaptics.c \
            -o project/src/main/resources/native/x86_64/libmobilehaptics.so

      - name: Build Fabric mod
        working-directory: project
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MobileHaptics-1.21.11
          path: project/build/libs/*.jar
