      - name: Build Android native libraries
        run: |
          set -e
          mkdir -p project/src/main/resources/native/arm64-v8a
          mkdir -p project/src/main/resources/native/x86_64

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"

          "$TOOLCHAIN/bin/aarch64-linux-android21-clang" \
            --sysroot="$SYSROOT" \
            -fPIC -shared \
            project/src/main/cpp/mobilehaptics.c \
            -o project/src/main/resources/native/arm64-v8a/libmobilehaptics.so

          "$TOOLCHAIN/bin/x86_64-linux-android21-clang" \
            --sysroot="$SYSROOT" \
            -fPIC -shared \
            project/src/main/cpp/mobilehaptics.c \
            -o project/src/main/resources/native/x86_64/libmobilehaptics.so

          file project/src/main/resources/native/arm64-v8a/libmobilehaptics.so
          file project/src/main/resources/native/x86_64/libmobilehaptics.so

      - name: Build mod
        working-directory: project
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mobile-haptics-1.21.11
          path: project/build/libs/*.jar
